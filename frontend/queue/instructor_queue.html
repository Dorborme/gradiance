<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instructor Manage Queue - Gradiance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="icon" href="image/icon.png" type="image/icon">
  <link rel="stylesheet" href="CSS/theme/GradianceThemeStyle.css">

  <style>
    body {
      background-color: #f8f9fa;
      transition: background-color 0.3s ease, color 0.3s ease;
      text-align: center;
    }

    /* ========================== Navigation bar ========================== */
    .navbar-custom {
      background-color: #e3eaf5;
      border-bottom: 2px solid #436599;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .navbar-left { display: flex; align-items: center; gap: 15px; }
    .navbar-left img { height: 45px; width: auto; border-radius: 8px; }

    .nav-link {
      color: #2e3b55;
      font-weight: 500;
      font-size: 16px;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 6px;
      transition: all 0.25s ease-in-out;
    }
    .nav-link:hover, .nav-link.active {
      background-color: #436599 !important;
      color: #fff !important;
      box-shadow: 0 0 6px rgba(67, 101, 153, 0.6);
      cursor: pointer;
    }

    .navbar-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      border: none;
      background: none;
      font-size: 1.4rem;
      color: #2e3b55;
      transition: color 0.3s, transform 0.3s;
      cursor: pointer;
    }
    .icon-btn:hover { color: #0d6efd; transform: scale(1.15); }

    /* ========================== Main layout ========================== */
    .main-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 40px;
      height: calc(100vh - 80px);
    }

    .queue-card {
      background-color: #e9f0fb;
      border: 2px solid #436599;
      border-radius: 8px;
      padding: 25px;
      width: 70%;
      max-width: 900px;
    }

    .inner-box {
      border: 2px solid #436599;
      background-color: #fff;
      border-radius: 6px;
      padding: 20px;
      margin-top: 15px;
    }

    /* ========================== Queue Table ========================== */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    thead { background-color: #436599; color: #fff; }
    th, td { border: 1px solid #436599; padding: 10px; text-align: center; }

    .btn-action {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 500;
      color: #fff;
      background-color: #436599;
      transition: background-color 0.2s;
      position: relative;
    }

    .btn-action:hover { background-color: #2f4871; }

    .move-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      z-index: 100;
      width: 140px;
      display: none;
      flex-direction: column;
      padding: 5px 0;
    }

    .move-menu.show { display: flex; animation: fadeIn 0.2s ease-in-out; }
    .move-option {
      padding: 8px 12px; text-align: left; font-size: 14px;
      cursor: pointer; display: flex; align-items: center;
      gap: 6px; transition: background 0.2s;
    }
    .move-option:hover { background-color: #e9f0fb; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #emptyMessage {
      color: #666;
      font-style: italic;
      padding: 15px;
      text-align: center;
    }

    /* ========================== dark mode ========================== */
    body.dark-mode { background-color: #121212; color: #fff; }
    body.dark-mode .navbar-custom { background-color: #1e1e1e; border-color: #444; }
    body.dark-mode .queue-card { background-color: #1c1c1c; border-color: #555; }
    body.dark-mode .inner-box { background-color: #2b2b2b; border-color: #666; }
    body.dark-mode th { background-color: #436599; }
    body.dark-mode td { border-color: #666; color: #fff; }
    body.dark-mode .move-menu { background: #2b2b2b; border-color: #555; }
    body.dark-mode .move-option:hover { background: #3a3a3a; }

    body.dark-mode .nav-link {
      color: #ffffff !important;
    }
    body.dark-mode .nav-link:hover,
    body.dark-mode .nav-link.active {
      background-color: #436599 !important; 
      color: #ffffff !important;
      box-shadow: 0 0 8px rgba(121, 184, 255, 0.4);
    }
    body.dark-mode .icon-btn {
      color: #ffffff !important;
    }
    body.dark-mode .icon-btn:hover {
      color: #79b8ff !important;
    }
  </style>
</head>

<body>
  <nav class="navbar-custom">
    <div class="navbar-left">
      <a href="./instructor_Homepage.html" id="logo">
        <img src="image/icon1.png" alt="Gradiance Logo">
      </a>
      <a href="./instructor_class_info.html" class="nav-link">Class Info</a>
      <a href="./instructor_queue.html" class="nav-link active" onclick="event.preventDefault();">Queue</a>
      <a href="./instructor_interview.html" class="nav-link">Interview</a>
      <a href="./instructor_question_manage.html" class="nav-link">Question Manage</a>
    </div>

    <div class="navbar-right">
      <button class="icon-btn" id="darkModeBtn"><i class="bi bi-moon-fill"></i></button>
      <button class="icon-btn" title="Settings"><i class="bi bi-gear-fill"></i></button>
    </div>
  </nav>

  <div class="main-container">
    <div class="queue-card">
      <h5>Queue Status</h5>
      <div class="inner-box">
        <h6>Queue List</h6>

        <table id="queueTable">
          <thead>
            <tr>
              <th>Order</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Class</th>
              <th>Competence</th>
              <th>Remove</th>
              <th>Move</th>
            </tr>
          </thead>
          <tbody id="queueBody"></tbody>
        </table>

        <div id="emptyMessage">No students in the queue</div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "http://localhost:8080/api/instructor"; 

    const queueBody = document.getElementById("queueBody");
    const emptyMsg = document.getElementById("emptyMessage");

    // ===== Obtain queue data =====
    async function fetchQueue() {
      try {
        const response = await fetch(`${BASE_URL}/queue`);
        if (!response.ok) throw new Error("Failed to fetch queue data");
        const data = await response.json();
        renderQueue(data);
      } catch (error) {
        console.error("Queue fetch error:", error);
        emptyMsg.textContent = "Error loading queue data.";
      }
    }

    function renderQueue(students = []) {
      queueBody.innerHTML = "";
      if (students.length === 0) {
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      students.forEach((student, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${student.firstName}</td>
          <td>${student.lastName}</td>
          <td>${student.className}</td>
          <td>${student.competence}</td>
          <td><button class="btn-action btn-remove" data-id="${student.id}">Remove</button></td>
          <td style="position: relative;">
            <button class="btn-action btn-move" data-id="${student.id}">Move</button>
            <div class="move-menu">
              <div class="move-option" data-action="top" data-id="${student.id}"><i class="bi bi-arrow-up"></i> Move to Top</div>
              <div class="move-option" data-action="up" data-id="${student.id}"><i class="bi bi-arrow-bar-up"></i> Move Up One</div>
            </div>
          </td>
        `;
        queueBody.appendChild(row);
      });
    }

    // ===== DELETE =====
    async function removeStudent(id) {
      try {
        await fetch(`${BASE_URL}/queue/${id}`, { method: "DELETE" });
        fetchQueue();
      } catch (e) {
        console.error("Remove failed:", e);
      }
    }

    // ===== POST =====
    async function moveStudent(id, action) {
      try {
        await fetch(`${BASE_URL}/queue/move`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, action })
        });
        fetchQueue();
      } catch (e) {
        console.error("Move failed:", e);
      }
    }

    // ===== Event entrustment =====
    queueBody.addEventListener("click", (e) => {
      const id = e.target.dataset.id;
      if (e.target.classList.contains("btn-remove")) {
        removeStudent(id);
      }

      if (e.target.classList.contains("btn-move")) {
        const menu = e.target.nextElementSibling;
        document.querySelectorAll(".move-menu").forEach(m => m.classList.remove("show"));
        menu.classList.toggle("show");
      }

      if (e.target.classList.contains("move-option")) {
        moveStudent(id, e.target.dataset.action);
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".btn-move") && !e.target.closest(".move-menu")) {
        document.querySelectorAll(".move-menu").forEach(m => m.classList.remove("show"));
      }
    });

    // ===== dark mode =====
    document.addEventListener("DOMContentLoaded", () => {
      const darkBtn = document.getElementById("darkModeBtn");
      const icon = darkBtn.querySelector("i");

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        icon.classList.replace("bi-moon-fill", "bi-sun-fill");
      }

      darkBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          icon.classList.replace("bi-moon-fill", "bi-sun-fill");
        } else {
          localStorage.setItem("theme", "light");
          icon.classList.replace("bi-sun-fill", "bi-moon-fill");
        }
      });

      fetchQueue();
    });
  </script>
</body>
</html>
