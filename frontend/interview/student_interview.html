<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Interview - Gradiance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>
  body {
    background-color: #f8f9fa;
    transition: background-color 0.3s ease, color 0.3s ease;
    text-align: center;
  }

  /* ===== Navigation bar ===== */
  .navbar-custom {
    background-color: #e3eaf5;
    border-bottom: 2px solid #436599;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
  }

  .navbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .navbar-left img {
    height: 45px;
    border-radius: 8px;
  }

  .nav-link {
    color: #2e3b55;
    font-weight: 500;
    text-decoration: none;
    padding: 8px 15px;
    border-radius: 6px;
    transition: all 0.2s ease-in-out;
  }

  /* Activation status */
  .nav-link.active {
    background-color: #436599;
    color: white;
    cursor: default;
  }

  .nav-link:hover {
    background-color: #436599;
    color: white;
  }

  .navbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn {
    border: none;
    background: none;
    font-size: 1.3rem;
    color: #2e3b55;
    transition: 0.25s;
    cursor: pointer;
  }

  .icon-btn:hover {
    color: #0d6efd;
    transform: scale(1.1);
  }

  /* ===== Main content ===== */
  .main-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 40px;
    height: calc(100vh - 80px);
  }

  .interview-box {
    background-color: #e9f0fb;
    border: 2px solid #436599;
    border-radius: 8px;
    padding: 20px;
    width: 80%;
    max-width: 950px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .panel-title {
    text-align: center;
    font-weight: 700;
    margin-bottom: 15px;
    color: #2e3b55;
  }

  /* ===== Question Area ===== */
  .question-panel {
    background: #fff;
    border: 2px solid #436599;
    border-radius: 8px;
    flex-grow: 1;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 15px;
  }

  .question-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex: 1;
  }

  .question-box {
    flex: 1;
    border: 1.5px solid #436599;
    border-radius: 6px;
    background: #f9fbff;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #studentResponseBox {
    flex: 1;
    border: 1.5px solid #436599;
    border-radius: 6px;
    background: #ffffff;
    padding: 12px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-custom {
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 500;
    color: #fff;
    background-color: #436599;
    transition: all 0.3s ease;
  }

  .btn-custom:hover {
    background-color: #2f4871;
  }

  .leave-section {
    margin-top: 15px;
    text-align: center;
  }

  /* ===== Dark mode ===== */
  body.dark-mode {
    background-color: #121212;
    color: #ffffff;
  }

  /* ===== The overall navigation bar ===== */
  body.dark-mode .navbar-custom {
    background-color: #1e1e1e;
    border-color: #444;
  }

  body.dark-mode .nav-link {
    color: #ffffff !important;
  }

  body.dark-mode .nav-link:hover,
  body.dark-mode .nav-link.active {
    background-color: #436599;
    color: #ffffff !important;
  }

  body.dark-mode .icon-btn {
    color: #ffffff !important;
  }

  body.dark-mode .icon-btn:hover {
    color: #5c8fff !important;
    transform: scale(1.1);
  }

  /* ================= Main body part ================= */
  body.dark-mode .interview-box {
    background-color: #1c1c1c;
    border-color: #555;
    color: #ffffff;
  }

  body.dark-mode .question-panel {
    background-color: #2b2b2b;
    border-color: #666;
    color: #ffffff;
  }

  body.dark-mode .question-box,
  body.dark-mode #studentResponseBox {
    background-color: #2e2e2e;
    border-color: #888;
    color: #ffffff;
  }

  /* All text elements are uniformly white */
  body.dark-mode .panel-title,
  body.dark-mode .question-box *,
  body.dark-mode #studentResponseBox *,
  body.dark-mode .input-row *,
  body.dark-mode label,
  body.dark-mode p,
  body.dark-mode span,
  body.dark-mode h6,
  body.dark-mode h5,
  body.dark-mode h4,
  body.dark-mode h3,
  body.dark-mode h2,
  body.dark-mode h1 {
    color: #ffffff !important;
  }

  /* Input box */
  body.dark-mode input.form-control,
  body.dark-mode textarea.form-control {
    background-color: #2b2b2b !important;
    color: #ffffff !important;
    border: 1.5px solid #999 !important;
  }

  body.dark-mode input.form-control::placeholder,
  body.dark-mode textarea.form-control::placeholder {
    color: #cccccc !important;
  }

  body.dark-mode .btn-custom {
    background-color: #5c7ab8;
    color: #ffffff !important;
  }

  body.dark-mode .btn-custom:hover {
    background-color: #799fe8;
  }

  body.dark-mode .leave-section .btn-custom {
    background-color: #4a69b1 !important;
  }

  body.dark-mode .leave-section .btn-custom:hover {
    background-color: #6788e0 !important;
  }
</style>

</head>

<body>
  <!-- ===== Input box ===== -->
  <nav class="navbar-custom">
    <div class="navbar-left">
      <a href="./student.homepage.html"><img src="image/icon1.png" alt="Gradiance Logo"></a>
      <a href="./student_class_info.html" class="nav-link">Class Info</a>
      <a href="./student_interview.html" class="nav-link active" onclick="event.preventDefault();">Interview</a>
    </div>
    <div class="navbar-right">
      <button class="icon-btn" id="darkModeBtn"><i class="bi bi-moon-fill"></i></button>
      <button class="icon-btn"><i class="bi bi-gear-fill"></i></button>
    </div>
  </nav>

  <!-- ===== Main content ===== -->
  <div class="main-container">
    <div class="interview-box">
      <div class="panel question-panel">
        <h6 class="panel-title">Question Area</h6>

        <div class="question-top">
          <div class="question-box" id="latestTextBox">
            <p class="text-muted mb-0" id="latestText">No message sent yet.</p>
          </div>
          <div class="question-box" id="latestImageBox" style="width:40%;">
            <p class="text-muted mb-0" id="noImageText">No image sent yet.</p>
            <img id="latestImage" src="" alt="No image" style="max-width:100%; display:none; border-radius:6px;">
          </div>
        </div>

        <div id="studentResponseBox">
          <p class="text-muted mb-0">No message yet.</p>
        </div>

        <div class="input-row">
          <input id="messageInput" type="text" class="form-control" placeholder="Type a message...">
          <label for="imageUpload" class="btn btn-outline-secondary mb-0">
            <i class="bi bi-image"></i>
          </label>
          <input id="imageUpload" type="file" accept="image/*" style="display:none;">
          <button id="sendBtn" class="btn-custom">Send</button>
        </div>
      </div>

      <div class="leave-section">
        <button class="btn-custom" id="leaveBtn">Leave</button>
      </div>
    </div>
  </div>

  <!-- ===== JS ===== -->
  <script>
    // ===== Dark mode switch =====
    const darkBtn = document.getElementById("darkModeBtn");
    const icon = darkBtn.querySelector("i");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      icon.classList.replace("bi-moon-fill", "bi-sun-fill");
    }
    darkBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
        icon.classList.replace("bi-moon-fill", "bi-sun-fill");
      } else {
        localStorage.setItem("theme", "light");
        icon.classList.replace("bi-sun-fill", "bi-moon-fill");
      }
    });

    // ===== 离开面试 =====
    document.getElementById("leaveBtn").addEventListener("click", () => {
      window.location.href = "student_homepage.html";
    });
  </script>
</body>
</html>
